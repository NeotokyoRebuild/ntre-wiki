name: "🏗  CI"

# Every pull request into main must pass ./check, the same checks ./deploy runs.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ntre-wiki

      - uses: ./ntre-wiki/.github/actions/setup

      - name: ./check
        working-directory: ntre-wiki
        run: ./check
