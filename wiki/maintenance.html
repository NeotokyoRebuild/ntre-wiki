<!DOCTYPE html>
<!-- The page `./deploy maintenance on` puts up in place of the wiki, as the site's index.html
     and 404.html. GitHub Pages serves 404.html for every address that has no file, so every
     link into the hidden wiki lands here too. Everything is inline, because the page is served
     at any depth and can't rely on a relative path. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>NT;RE Wiki: down for maintenance</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #1b1c1f;
      --border: #2d2e33;
      --text: #d4d4d6;
      --text-strong: #f4f4f5;
      --muted: #8f9096;
      --link: #a2bec3;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fafafa;
        --border: #e0e2e6;
        --text: #2a2e34;
        --text-strong: #111317;
        --muted: #646b74;
        --link: #2f6a74;
      }
    }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      max-width: 32rem;
      padding: 2rem;
      text-align: center;
    }
    .nt-mark { width: 7rem; height: auto; color: var(--text-strong); }
    h1 {
      margin: 1.5rem 0 0.5rem;
      color: var(--text-strong);
      font-size: 1.5rem;
      font-weight: 600;
    }
    p { margin: 0.5rem 0; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    hr { margin: 1.5rem auto; width: 4rem; border: 0; border-top: 1px solid var(--border); }
    a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="4 0 37 22" class="nt-mark" role="img" aria-label="NT;RE">
      <path fill="currentColor" opacity="0.3" d="M9 6h3v2h-3zM17 6h1v2h-1zM9 8h1v2h-1zM17 8h1v2h-1zM9 10h1v2h-1zM17 10h1v2h-1zM9 12h1v2h-1zM17 12h1v2h-1zM9 14h1v2h-1zM17 14h1v2h-1zM5 16h5v2h-5zM17 16h1v2h-1zM17 18h1v2h-1zM13 20h5v2h-5zM24 6h7v2h-7zM24 8h1v2h-1zM24 10h1v2h-1zM29 14h1v2h-1zM20 16h10v2h-10zM39 6h1v2h-1zM38 8h2v2h-2zM35 10h4v2h-4zM40 14h1v2h-1zM38 16h3v2h-3zM36 18h3v2h-3zM34 20h3v2h-3z"/>
      <path fill="currentColor" d="M7 2h8v2h-8zM5 4h12v2h-12zM4 6h5v2h-5zM12 6h5v2h-5zM4 8h5v2h-5zM12 8h5v2h-5zM4 10h5v2h-5zM12 10h5v2h-5zM4 12h5v2h-5zM12 12h5v2h-5zM4 14h5v2h-5zM12 14h5v2h-5zM12 16h5v2h-5zM12 18h5v2h-5zM20 0h4v2h-4zM19 2h10v2h-10zM19 4h11v2h-11zM19 6h5v2h-5zM19 8h5v2h-5zM19 10h5v2h-5zM19 12h10v2h-10zM19 14h10v2h-10zM35 12h5v2h-5zM35 14h5v2h-5zM34 16h4v2h-4zM33 18h3v2h-3z"/>
      <path fill="#d1482e" d="M34 2h4v2h-4zM33 4h6v2h-6zM33 6h6v2h-6zM34 8h4v2h-4z"/>
    </svg>
    <h1>The wiki is down for maintenance</h1>
    <p>The NT;RE Wiki is being updated and will be back soon.</p>
    <hr>
    <p class="muted">The game's code is on GitHub at <a href="https://github.com/NeotokyoRebuild/neo">NeotokyoRebuild/neo</a>.</p>
  </main>
</body>
</html>
