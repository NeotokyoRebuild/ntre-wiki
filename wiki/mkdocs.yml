site_name: NT;RE Wiki
# The published address comes from the deploy (./deploy), not from here, so
# local builds and previews carry no host URL and serve from /.
site_url: !ENV NTRE_WIKI_URL
site_description: Reference wiki for NEOTOKYO Rebuild, with every stat sourced from the game's code.
# The header links to the game's repositories (extra.repos below), not to
# this one. repo_url only switches that header slot on.
repo_url: https://github.com/NeotokyoRebuild/neo
repo_name: NeotokyoRebuild/neo
# "Edit this page" opens the page's Markdown in GitHub's editor, in this
# repository. It's a full address because repo_url points elsewhere.
edit_uri: https://github.com/NeotokyoRebuild/ntre-wiki/edit/main/wiki/docs/

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: assets/favicon.png
  font:
    text: Inter
    code: IBM Plex Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    # Dark first: it's the default. Colours come from stylesheets/ntre.css.
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.footnote.tooltips
    - content.tooltips
    - content.action.edit

extra_css:
  - stylesheets/ntre.css

extra_javascript:
  - javascripts/sources.js

extra:
  generator: false
  # The repositories linked in the header, drawn by
  # overrides/partials/source.html with facts from docs/javascripts/sources.js.
  repos:
    - NeotokyoRebuild/neo
    - NeotokyoRebuild/neoAssets
  # Version dropdown in the header, fed by `mike` on the gh-pages branch.
  # It stays hidden until a versions.json exists, so local builds show nothing.
  version:
    provider: mike
    alias: true

plugins:
  - search
  # Versioned deploys: ./deploy has mike build each version into its own
  # folder on the gh-pages branch. Aliases are copies because GitHub Pages
  # refuses to deploy symlinks. Leave mike's version_selector on: Material
  # only draws its version menu when it is.
  - mike:
      alias_type: copy
      # Every version's pages name the latest version as canonical, so each
      # page has one stable address.
      canonical_version: latest

hooks:
  - hooks/ntre.py

watch:
  - data
  - hooks
  - column-tips.yml
  - ../WRITING-STYLE.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys
  # Includes WRITING-STYLE.md (at the repository root) in the style guide page.
  - pymdownx.snippets:
      base_path: !relative $config_dir/..
      check_paths: true

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Game modes:
      - game-modes/index.md
      - Capture the Ghost:
          - game-modes/capture-the-ghost/index.md
          - The Ghost: game-modes/capture-the-ghost/ghost.md
      - Team Deathmatch: game-modes/team-deathmatch.md
      - Deathmatch: game-modes/deathmatch.md
      - VIP: game-modes/vip.md
      - Juggernaut: game-modes/juggernaut.md
  - Classes:
      - classes/index.md
      - Recon: classes/recon.md
      - Assault: classes/assault.md
      - Support: classes/support.md
  - Weapons:
      - weapons/index.md
      - Submachine guns:
          - weapons/submachine-guns/index.md
          - MPN45: weapons/submachine-guns/mpn45.md
          - MPN45 (unsilenced): weapons/submachine-guns/mpn45-unsilenced.md
          - SRM: weapons/submachine-guns/srm.md
          - SRM-S: weapons/submachine-guns/srm-s.md
          - Jitte: weapons/submachine-guns/jitte.md
          - Jitte-S: weapons/submachine-guns/jitte-s.md
      - Rifles:
          - weapons/rifles/index.md
          - ZR68C: weapons/rifles/zr68c.md
          - ZR68-S: weapons/rifles/zr68-s.md
          - MX: weapons/rifles/mx.md
          - MX-S: weapons/rifles/mx-s.md
          - Mosok: weapons/rifles/mosok.md
          - Mosok-S: weapons/rifles/mosok-s.md
          - Mosok-L: weapons/rifles/mosok-l.md
      - Marksman rifles:
          - weapons/marksman-rifles/index.md
          - ZR68-L: weapons/marksman-rifles/zr68-l.md
          - SRS: weapons/marksman-rifles/srs.md
      - Shotguns:
          - weapons/shotguns/index.md
          - Murata Supa-7: weapons/shotguns/supa-7.md
          - AA13: weapons/shotguns/aa13.md
      - Machine guns:
          - weapons/machine-guns/index.md
          - PZ252: weapons/machine-guns/pz252.md
          - PBK56S: weapons/machine-guns/pbk56.md
      - Sidearms:
          - weapons/sidearms/index.md
          - MilSO: weapons/sidearms/milso.md
          - Tachi: weapons/sidearms/tachi.md
          - Kyla: weapons/sidearms/kyla.md
      - Melee:
          - weapons/melee/index.md
          - Knife: weapons/melee/knife.md
      - Grenades & explosives:
          - weapons/explosives/index.md
          - Frag grenade: weapons/explosives/frag-grenade.md
          - Smoke grenade: weapons/explosives/smoke-grenade.md
          - Detpack: weapons/explosives/detpack.md
  - Mechanics:
      - Damage & penetration: mechanics/damage.md
      - Loadouts & ranks: mechanics/loadouts.md
      - Movement: mechanics/movement.md
      - AUX power: mechanics/aux-power.md
      - Thermoptic camo: mechanics/thermoptic-camouflage.md
      - Vision modes: mechanics/vision-modes.md
  - World:
      - Factions: world/factions.md
      - Maps: world/maps.md
  - Console variables: console-variables.md
  - About:
      - about/index.md
      - Style guide: about/style-guide.md
      - Logos: about/logos.md
      - Colours & type: about/colours-and-type.md
